<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Thot-B-Gone</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="app-header">
    <img src="icon48.png" alt="" width="40" height="40">
    <div>
      <h1>Thot-B-Gone</h1>
      <p>Local timeline controls for X</p>
    </div>
    <label class="switch" aria-label="Enable filtering">
      <input id="enabled" type="checkbox">
      <span aria-hidden="true"></span>
    </label>
  </header>

  <main>
    <p id="status" class="status" role="status">Loading settings...</p>

    <section aria-labelledby="filters-title">
      <h2 id="filters-title">Filters</h2>
      <label class="setting-row">
        <span><strong>Platform links</strong><small>OnlyFans, Fansly, Fanvue, and similar links</small></span>
        <input id="blockPlatformLinks" type="checkbox">
      </label>
      <label class="setting-row">
        <span><strong>Explicit phrases</strong><small>High-confidence adult-content terms</small></span>
        <input id="blockExplicitTerms" type="checkbox">
      </label>
      <label class="setting-row">
        <span><strong>Collapsed notice</strong><small>Allow a filtered post to be revealed once</small></span>
        <input id="showWarnings" type="checkbox">
      </label>
      <fieldset>
        <legend>Sensitivity</legend>
        <label><input type="radio" name="sensitivity" value="balanced"> Balanced</label>
        <label><input type="radio" name="sensitivity" value="strict"> Strict</label>
      </fieldset>
    </section>

    <section aria-labelledby="lists-title">
      <h2 id="lists-title">Account exceptions</h2>
      <label for="allowlist">Always allow</label>
      <textarea id="allowlist" rows="2" placeholder="One X handle per line"></textarea>
      <label for="blocklist">Always filter</label>
      <textarea id="blocklist" rows="2" placeholder="One X handle per line"></textarea>
      <button id="saveLists" class="primary" type="button">Save account lists</button>
    </section>

    <section aria-labelledby="stats-title">
      <div class="section-heading">
        <h2 id="stats-title">Filtered locally</h2>
        <button id="resetStats" class="text-button" type="button">Reset</button>
      </div>
      <div class="stats-grid">
        <div><strong id="totalBlocked">0</strong><span>Total</span></div>
        <div><strong id="platformLinks">0</strong><span>Links</span></div>
        <div><strong id="explicitPhrases">0</strong><span>Explicit</span></div>
        <div><strong id="promotionalPhrases">0</strong><span>Promotional</span></div>
      </div>
      <p id="lastReset" class="fine-print"></p>
    </section>
  </main>

  <footer>Runs on X pages only. No browsing data leaves your browser.</footer>
  <script src="popup.js"></script>
</body>
</html>
